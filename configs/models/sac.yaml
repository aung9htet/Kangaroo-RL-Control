id: sac
name: SAC
family: continuous off-policy
action_space: "Box[-1,1]^7: v = v_max * clip(a, -1, 1)"
paper: {authors: "Haarnoja, T. et al.", title: "Soft Actor-Critic: Off-Policy Maximum Entropy Deep Reinforcement Learning with a Stochastic Actor", venue: "ICML 2018 (PMLR 80)", url: "https://proceedings.mlr.press/v80/haarnoja18b.html"}
implementation: "stable-baselines3 2.7.1 SAC with the goal-relabelling replay"
n_envs: 16
off_policy: true
goal_relabelling: {enabled: true, strategy: future, ratio: 0.8}
hyper:
  gamma: 0.95
  lr: 3.0e-4
  batch: 256
  tau: 0.005
  learning_starts: 10000      # random actions first; must be >= n_envs * horizon so one episode is complete
  replay: 1000000
  her_ratio: 0.8
  n_step: 1                   # paper default; the GoalReplay supports n > 1 (used by DecQN)
  utd: 1                      # one gradient step per environment transition (gradient_steps = -1)
  net_arch: [256, 256]
  ent_coef: auto